name: Migrate site assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy original site images into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          BASE="https://mariapazbravo-studio.jammy-crab-6012.chatgpt.site/assets"
          curl -fL "$BASE/logo.png" -o assets/logo.png
          curl -fL "$BASE/photo-20.jpg" -o assets/hero.jpg
          curl -fL "$BASE/photo-20.jpg" -o assets/gastronomico.jpg
          curl -fL "$BASE/consola.jpg" -o assets/consola.jpg
          curl -fL "$BASE/photo-12.jpg" -o assets/residencia.jpg
          curl -fL "$BASE/photo-07.jpg" -o assets/cocina.jpg
          curl -fL "$BASE/photo-14.jpg" -o assets/mesa.jpg
          curl -fL "$BASE/photo-09.jpg" -o assets/mueble-curvo.jpg
          curl -fL "$BASE/photo-16.jpg" -o assets/lampara.jpg
          curl -fL "$BASE/photo-17.jpg" -o assets/muro-madera.jpg
          curl -fL "$BASE/photo-22.jpg" -o assets/interior-textura.jpg
          test -s assets/logo.png
          test -s assets/hero.jpg

      - name: Commit copied assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Assets already present"
          else
            git commit -m "Copy original website assets"
            git push
          fi
